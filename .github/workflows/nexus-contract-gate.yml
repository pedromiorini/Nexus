name: Nexus Contract Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-gate:
    name: Contract and regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install CI dependencies (runtime, test backends and gates)
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Require optional graph backend in the test profile
        run: python -c "import networkx; print('NetworkX', networkx.__version__)"

      - name: Validate constitutional runtime requirements
        run: python -m pip install --dry-run --no-deps -r requirements_constitutional.txt

      - name: Keep generated databases out of the workspace
        run: echo "NEXUS_AUDIT_DB=$RUNNER_TEMP/nexus_audit.sqlite3" >> "$GITHUB_ENV"

      - name: Lint Python (ruff)
        run: ruff check core vita tools test_*.py benchmarks/nexus_pomdp_benchmark_v2.py

      - name: Install actionlint (pinned, checksum-verified)
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install zizmor (pinned, checksum-verified)
        run: |
          version=1.31.1
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/zizmorcore/zizmor/releases/download/v${version}/${archive}"
          echo "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" zizmor
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows (actionlint and zizmor)
        run: |
          actionlint .github/workflows/*.yml
          zizmor --offline --no-progress .github/workflows

      - name: Compile all Python modules
        run: python -m compileall -q core vita tools test_*.py benchmarks/nexus_pomdp_benchmark_v2.py

      - name: Generate reality audit report
        run: python tools/reality_audit.py

      - name: Verify committed reality reports are current
        run: |
          if ! git diff --exit-code -- AUDIT_REALITY_REPORT.md audit_reality.json; then
            echo "::error::Relatorios de realidade desatualizados. Rode 'python tools/reality_audit.py' e faca commit dos arquivos."
            exit 1
          fi

      - name: Retain reality audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-reality-audit
          path: |
            AUDIT_REALITY_REPORT.md
            audit_reality.json
          if-no-files-found: error
          retention-days: 14

      - name: Run contract and integrated suites with coverage
        env:
          NEXUS_INTEGRATED_SUMMARY: integrated-summary.json
        run: |
          coverage run --branch -m unittest discover -p 'test_*.py'
          coverage run --append --branch core/constitutional_brain.py
          test -s integrated-summary.json
          coverage report --fail-under=0
          coverage report --include='core/deferred_task_queue.py' --fail-under=90
          coverage report --include='core/vram_defense_guard.py' --fail-under=90
          coverage report --include='core/temporal_facts.py' --fail-under=90
          coverage report --include='vita/nexus_constitutional_bridge_v3.py' --fail-under=70
          coverage report --include='core/constitutional_brain.py' --fail-under=62
          coverage xml -o coverage.xml

      - name: Retain coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-contract-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run deferred queue snapshot contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_deferred_task_snapshot.py

      - name: Run immutable log and jailbreak detector contracts
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_immutable_log_contract.py test_jailbreak_detector_contract.py

      - name: Run expanded contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_memory_sql_contract.py test_security_triage.py test_error_correction_contract.py test_embedded_assert_audit.py test_central_router_contract.py test_implementation_gap_audit.py test_explicit_gap_contract.py test_working_memory_contract.py test_hardware_telemetry_contract.py test_counterfactual_contract.py test_multimodal_backend_contract.py test_swarm_statistics_contract.py test_episodic_memory_statistics_contract.py test_episodic_memory_search_limits_contract.py test_episodic_memory_concurrency_contract.py test_vita_audit_concurrency_contract.py test_vita_audit_cross_connection_contract.py test_attention_signal_contract.py test_integration_synergy_contract.py test_knowledge_graph_contract.py test_sensorimotor_multimodal_contract.py test_consensus_application_contract.py test_shadow_clone_reintegration_contract.py test_reminiscence_bump_contract.py test_state_manifest.py test_mcts_action_contract.py

      - name: Run tool definition timeout contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_tool_definition_contract.py

      - name: Run tool parameter boundary contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_tool_parameter_contract.py

      - name: Run strict JSON format contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_format_json_contract.py

      - name: Run tool cache key boundary contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_tool_cache_key_contract.py

      - name: Run tool cache snapshot contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_tool_cache_snapshot_contract.py

      - name: Run tool cache store fallback contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_tool_cache_store_contract.py

      - name: Run tool cache hit fallback contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_tool_cache_hit_contract.py

      - name: Run state consistency contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_state_consistency_audit.py

      - name: Run reproducible capability benchmark
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v test_capability_benchmark.py
          python -m benchmarks.nexus_capability_benchmark --seed 20261016 --output capability-benchmark.json
          test -s capability-benchmark.json

      - name: Retain capability benchmark report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-capability-benchmark
          path: capability-benchmark.json
          if-no-files-found: error
          retention-days: 14

      - name: Run versioned POMDP belief benchmark v2
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v test_pomdp_belief_filter_contract.py test_pomdp_benchmark_v2.py
          python -m benchmarks.nexus_pomdp_benchmark_v2 --seed 20261016 --output pomdp-belief-benchmark-v2.json
          test -s pomdp-belief-benchmark-v2.json

      - name: Retain POMDP belief benchmark v2 report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-pomdp-belief-benchmark-v2
          path: pomdp-belief-benchmark-v2.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run targeted mutation gate
        run: python tools/targeted_mutation.py

      - name: Retain mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-mutation-report
          path: targeted_mutation_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Run static security scan
        run: bandit -r core vita tools -f json -o bandit-report.json || [ -s bandit-report.json ]

      - name: Generate security triage and audits
        run: |
          python tools/security_triage.py bandit-report.json security-triage-generated.md
          python tools/security_triage.py bandit-report.json SECURITY_TRIAGE.md --check
          python tools/embedded_assert_audit.py bandit-report.json core/constitutional_brain.py
          python tools/implementation_gap_audit.py core/constitutional_brain.py --output implementation-gaps.json

      - name: Enforce security severity policy
        run: |
          python - <<'PY'
          import json
          with open('bandit-report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          severe = [item for item in report.get('results', []) if item.get('issue_severity') in {'MEDIUM', 'HIGH'}]
          if severe:
              raise SystemExit(f'Untriaged MEDIUM/HIGH Bandit findings: {len(severe)}')
          print('Bandit severity policy passed: no MEDIUM/HIGH findings')
          PY

      - name: Retain security scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-bandit-report
          path: |
            bandit-report.json
            security-triage-generated.md
            implementation-gaps.json
          if-no-files-found: error
          retention-days: 14

      - name: Run final full test suite summary
        run: python tools/test_summary.py --output test-summary.json

      - name: Retain inputs for final state attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-state-manifest-inputs
          path: |
            test-summary.json
            integrated-summary.json
            bandit-report.json
            targeted_mutation_report.json
            audit_reality.json
            implementation-gaps.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify clean generated artifacts
        run: |
          rm -f nexus_audit.sqlite3
          rm -f test-summary.json
          rm -f integrated-summary.json
          rm -f capability-benchmark.json
          rm -f pomdp-belief-benchmark-v2.json
          if find . -type f \( -name '*.sqlite3' -o -name '*.db' \) -print -quit | grep -q .; then
            echo 'Unexpected database artifact detected'
            exit 1
          fi

  state-manifest:
    name: Final state attestation
    needs: contract-gate
    if: needs.contract-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GATES_STATUS: ${{ needs.contract-gate.result }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download outputs from completed gates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nexus-state-manifest-inputs
          path: .

      - name: Generate final state manifest
        run: >-
          python tools/state_manifest.py
          --output STATE_MANIFEST.json
          --test-result passed
          --test-command "python -m unittest discover -p 'test_*.py'"
          --gates-status "$GATES_STATUS"

      - name: Run state consistency gate
        run: python tools/state_consistency_audit.py --manifest STATE_MANIFEST.json --output state-consistency.json

      - name: Retain current state manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-state-manifest
          path: |
            STATE_MANIFEST.json
            integrated-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain state consistency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-state-consistency
          path: state-consistency.json
          if-no-files-found: error
          retention-days: 14
