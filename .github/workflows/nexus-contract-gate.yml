name: Nexus Contract Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-gate:
    name: Contract and regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Keep generated databases out of the workspace
        run: echo "NEXUS_AUDIT_DB=$RUNNER_TEMP/nexus_audit.sqlite3" >> "$GITHUB_ENV"

      - name: Lint Python (ruff)
        run: ruff check core vita tools test_*.py

      - name: Install actionlint (pinned, checksum-verified)
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows (actionlint and zizmor)
        run: |
          actionlint .github/workflows/*.yml
          zizmor --offline --no-progress .github/workflows

      - name: Compile all Python modules
        run: python -m compileall -q core vita tools test_*.py

      - name: Generate reality audit report
        run: python tools/reality_audit.py

      - name: Verify committed reality reports are current
        run: |
          if ! git diff --exit-code -- AUDIT_REALITY_REPORT.md audit_reality.json; then
            echo "::error::Relatorios de realidade desatualizados. Rode 'python tools/reality_audit.py' e faca commit dos arquivos."
            exit 1
          fi

      - name: Retain reality audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-reality-audit
          path: |
            AUDIT_REALITY_REPORT.md
            audit_reality.json
          if-no-files-found: error
          retention-days: 14

      - name: Run all tests with coverage (contract suite, then integrated suite)
        env:
          NEXUS_INTEGRATED_SUMMARY: integrated-summary.json
        run: |
          python -W error -m coverage run -m unittest discover -v -p 'test_*.py'
          python -W error -m coverage run -a core/constitutional_brain.py
          test -s integrated-summary.json

      - name: Enforce coverage gates
        run: |
          python -m coverage report
          python -m coverage report --include='core/deferred_task_queue.py' --fail-under=90
          python -m coverage report --include='core/vram_defense_guard.py' --fail-under=90
          python -m coverage report --include='vita/nexus_constitutional_bridge_v3.py' --fail-under=70
          python -m coverage report --include='core/constitutional_brain.py' --fail-under=62
          python -m coverage xml -o coverage.xml

      - name: Retain coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-contract-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run targeted mutation gate
        run: python tools/targeted_mutation.py

      - name: Retain mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-mutation-report
          path: targeted_mutation_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Run static security scan
        run: bandit -r core vita tools -f json -o bandit-report.json || [ -s bandit-report.json ]

      - name: Generate security triage and audits
        run: |
          python tools/security_triage.py bandit-report.json security-triage-generated.md
          python tools/security_triage.py bandit-report.json SECURITY_TRIAGE.md --check
          python tools/embedded_assert_audit.py bandit-report.json core/constitutional_brain.py
          python tools/implementation_gap_audit.py core/constitutional_brain.py --output implementation-gaps.json

      - name: Enforce security severity policy
        run: |
          python - <<'PY'
          import json
          with open('bandit-report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          severe = [item for item in report.get('results', []) if item.get('issue_severity') in {'MEDIUM', 'HIGH'}]
          if severe:
              raise SystemExit(f'Untriaged MEDIUM/HIGH Bandit findings: {len(severe)}')
          print('Bandit severity policy passed: no MEDIUM/HIGH findings')
          PY

      - name: Retain security scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-bandit-report
          path: |
            bandit-report.json
            security-triage-generated.md
            implementation-gaps.json
          if-no-files-found: error
          retention-days: 14

      - name: Run final full test suite summary
        run: python tools/test_summary.py --output test-summary.json

      - name: Generate current state manifest
        env:
          CI_STATUS: ${{ job.status }}
        run: >-
          python tools/state_manifest.py
          --output STATE_MANIFEST.json
          --test-result passed
          --test-command "python -m unittest discover -p 'test_*.py'"
          --ci-status "$CI_STATUS"

      - name: Run state consistency gate
        run: python tools/state_consistency_audit.py --manifest STATE_MANIFEST.json --output state-consistency.json

      - name: Retain current state manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-state-manifest
          path: |
            STATE_MANIFEST.json
            integrated-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain state consistency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-state-consistency
          path: state-consistency.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify clean workspace
        run: |
          if find . -path ./.git -prune -o -type f \( -name '*.sqlite3' -o -name '*.db' \) -print -quit | grep -q .; then
            echo 'Unexpected database artifact detected'
            exit 1
          fi
          git diff --exit-code

  python-compat:
    name: Python compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Keep generated databases out of the workspace
        run: echo "NEXUS_AUDIT_DB=$RUNNER_TEMP/nexus_audit.sqlite3" >> "$GITHUB_ENV"

      - name: Run tests with development-mode checks
        run: |
          python -X dev -W error -m unittest discover -p 'test_*.py' 2> dev-tests.log || { cat dev-tests.log; exit 1; }
          cat dev-tests.log
          if grep -q 'ResourceWarning' dev-tests.log; then echo '::error::ResourceWarning detected in the test run'; exit 1; fi

      - name: Run integrated suite with development-mode checks
        run: |
          python -X dev -W error core/constitutional_brain.py > dev-integrated.log 2>&1 || { cat dev-integrated.log; exit 1; }
          tail -8 dev-integrated.log
          if grep -q 'ResourceWarning' dev-integrated.log; then echo '::error::ResourceWarning detected in the integrated suite'; exit 1; fi
