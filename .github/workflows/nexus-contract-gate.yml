name: Nexus Contract Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-gate:
    name: Contract and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip numpy coverage hypothesis bandit

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            core/constitutional_brain.py \
            core/deferred_task_queue.py \
            vita/nexus_constitutional_bridge_v3.py \
            test_deferred_task_queue.py \
            test_recovery_diagnostics_contract.py \
            test_reality_audit.py \
            test_deferred_task_properties.py

      - name: Run schema contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_recovery_diagnostics_contract.py

      - name: Run reality audit tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_reality_audit.py

      - name: Generate reality audit report
        run: python tools/reality_audit.py

      - name: Retain reality audit report
        uses: actions/upload-artifact@v4
        with:
          name: nexus-reality-audit
          path: |
            AUDIT_REALITY_REPORT.md
            audit_reality.json
          if-no-files-found: error
          retention-days: 14

      - name: Measure contract and regression coverage
        env:
          PYTHONPATH: .
        run: |
          coverage run --branch -m unittest test_recovery_diagnostics_contract.py test_deferred_task_queue.py test_reality_audit.py test_deferred_task_properties.py
          coverage report --fail-under=0
          coverage xml -o coverage.xml

      - name: Retain coverage report
        uses: actions/upload-artifact@v4
        with:
          name: nexus-contract-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run deferred queue regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_deferred_task_queue.py

      - name: Run deferred queue property tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_deferred_task_properties.py

      - name: Run static security scan
        run: bandit -r core vita tools -f json -o bandit-report.json || true

      - name: Retain security scan report
        uses: actions/upload-artifact@v4
        with:
          name: nexus-bandit-report
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Run integrated Nexus suite
        env:
          PYTHONPATH: .
        run: python core/constitutional_brain.py

      - name: Verify clean generated artifacts
        run: |
          rm -f nexus_audit.sqlite3
          if find . -type f \( -name '*.sqlite3' -o -name '*.db' \) -print -quit | grep -q .; then
            echo 'Unexpected database artifact detected'
            exit 1
          fi
