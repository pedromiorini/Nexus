name: Nexus Contract Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-gate:
    name: Contract and regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            core/constitutional_brain.py \
            core/deferred_task_queue.py \
            vita/nexus_constitutional_bridge_v3.py \
            test_deferred_task_queue.py \
            test_recovery_diagnostics_contract.py \
            test_reality_audit.py \
            test_deferred_task_properties.py \
            test_deferred_task_snapshot.py \
            test_immutable_log_contract.py \
            test_jailbreak_detector_contract.py \
            test_memory_sql_contract.py \
            test_security_triage.py \
            test_error_correction_contract.py \
            test_embedded_assert_audit.py \
            test_central_router_contract.py \
            test_vram_defense_guard.py \
            test_implementation_gap_audit.py \
            test_explicit_gap_contract.py \
            test_working_memory_contract.py \
            test_hardware_telemetry_contract.py \
            test_counterfactual_contract.py \
            test_multimodal_backend_contract.py \
            test_swarm_statistics_contract.py \
            test_episodic_memory_statistics_contract.py \
            test_episodic_memory_concurrency_contract.py \
            test_vita_audit_concurrency_contract.py \
            test_vita_audit_cross_connection_contract.py \
            test_attention_signal_contract.py \
            test_integration_synergy_contract.py \
            test_knowledge_graph_contract.py \
            test_sensorimotor_multimodal_contract.py \
            test_consensus_application_contract.py \
            test_shadow_clone_reintegration_contract.py \
            test_reminiscence_bump_contract.py \
            test_state_manifest.py \
            test_mcts_action_contract.py \
            test_state_consistency_audit.py \
            tools/test_summary.py \
            tools/diagnostics_dashboard.py \
            tools/security_triage.py \
            tools/embedded_assert_audit.py \
            tools/targeted_mutation.py \
            tools/implementation_gap_audit.py \
            tools/state_manifest.py \
            tools/state_consistency_audit.py

      - name: Run schema contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_recovery_diagnostics_contract.py

      - name: Run reality audit tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_reality_audit.py

      - name: Generate reality audit report
        run: python tools/reality_audit.py

      - name: Retain reality audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-reality-audit
          path: |
            AUDIT_REALITY_REPORT.md
            audit_reality.json
          if-no-files-found: error
          retention-days: 14

      - name: Measure contract and regression coverage
        env:
          PYTHONPATH: .
        run: |
          coverage run --branch -m unittest discover -p 'test_*.py'
          coverage report --fail-under=0
          coverage report --include='core/deferred_task_queue.py' --fail-under=90
          coverage report --include='vita/nexus_constitutional_bridge_v3.py' --fail-under=70
          coverage xml -o coverage.xml

      - name: Retain coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-contract-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run deferred queue snapshot contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_deferred_task_snapshot.py

      - name: Run immutable log and jailbreak detector contracts
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_immutable_log_contract.py test_jailbreak_detector_contract.py

      - name: Run expanded contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_memory_sql_contract.py test_security_triage.py test_error_correction_contract.py test_embedded_assert_audit.py test_central_router_contract.py test_implementation_gap_audit.py test_explicit_gap_contract.py test_working_memory_contract.py test_hardware_telemetry_contract.py test_counterfactual_contract.py test_multimodal_backend_contract.py test_swarm_statistics_contract.py test_episodic_memory_statistics_contract.py test_episodic_memory_concurrency_contract.py test_vita_audit_concurrency_contract.py test_vita_audit_cross_connection_contract.py test_attention_signal_contract.py test_integration_synergy_contract.py test_knowledge_graph_contract.py test_sensorimotor_multimodal_contract.py test_consensus_application_contract.py test_shadow_clone_reintegration_contract.py test_reminiscence_bump_contract.py test_state_manifest.py test_mcts_action_contract.py

      - name: Run state consistency contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_state_consistency_audit.py

      - name: Run targeted mutation gate
        env:
          PYTHONPATH: .
        run: python tools/targeted_mutation.py
      - name: Run deferred queue regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_deferred_task_queue.py

      - name: Run deferred queue property tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_deferred_task_properties.py

      - name: Run VRAM defense guard tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_vram_defense_guard.py

      - name: Run static security scan
        run: bandit -r core vita tools -f json -o bandit-report.json || true

      - name: Generate security triage
        run: |
          python tools/security_triage.py bandit-report.json security-triage-generated.md
          python tools/embedded_assert_audit.py bandit-report.json core/constitutional_brain.py
          python tools/implementation_gap_audit.py core/constitutional_brain.py --output implementation-gaps.json
      - name: Enforce security severity policy
        run: |
          python - <<'PY'
          import json
          with open('bandit-report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          severe = [item for item in report.get('results', []) if item.get('issue_severity') in {'MEDIUM', 'HIGH'}]
          if severe:
              raise SystemExit(f'Untriaged MEDIUM/HIGH Bandit findings: {len(severe)}')
          print('Bandit severity policy passed: no MEDIUM/HIGH findings')
          PY
      - name: Retain security scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-bandit-report
          path: |
            bandit-report.json
            security-triage-generated.md
            implementation-gaps.json
          if-no-files-found: error
          retention-days: 14

      - name: Run integrated Nexus suite
        env:
          PYTHONPATH: .
        run: python core/constitutional_brain.py

      - name: Run final full test suite summary
        env:
          PYTHONPATH: .
        run: python tools/test_summary.py --output test-summary.json

      - name: Retain inputs for final state attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-state-manifest-inputs
          path: |
            test-summary.json
            bandit-report.json
            targeted_mutation_report.json
            audit_reality.json
            implementation-gaps.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify clean generated artifacts
        run: |
          rm -f nexus_audit.sqlite3
          rm -f test-summary.json
          if find . -type f \( -name '*.sqlite3' -o -name '*.db' \) -print -quit | grep -q .; then
            echo 'Unexpected database artifact detected'
            exit 1
          fi

  state-manifest:
    name: Final state attestation
    needs: contract-gate
    if: needs.contract-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GATES_STATUS: ${{ needs.contract-gate.result }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download outputs from completed gates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nexus-state-manifest-inputs
          path: .

      - name: Generate final state manifest
        run: >-
          python tools/state_manifest.py
          --output STATE_MANIFEST.json
          --test-result passed
          --test-command "python -m unittest discover -p 'test_*.py'"
          --gates-status "$GATES_STATUS"

      - name: Run state consistency gate
        run: python tools/state_consistency_audit.py --manifest STATE_MANIFEST.json --output state-consistency.json

      - name: Retain current state manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-state-manifest
          path: STATE_MANIFEST.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain state consistency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-state-consistency
          path: state-consistency.json
          if-no-files-found: error
          retention-days: 14
